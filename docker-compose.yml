version: '3.8'

services:
  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fdtzTzsRwjatBwRRSVtKfBBHigLdemeW
      POSTGRES_DB: base_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432" # Изменён порт на 5434

  db_test:
    image: postgres:16
    container_name: test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aXMSpiJRgWFFtbzurGLlemjUUxjrbCra
      POSTGRES_DB: test_db
    volumes:
      - db_test_data:/var/lib/postgresql/data
    ports:
      - "5435:5432" # Изменён порт на 5435

  redis:
    image: redis:6-alpine
    container_name: redis
    command: ["redis-server","--save","60","1"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      BACKEND_URL: http://localhost:8080 # Добавлено
      FRONTEND_URL: http://localhost:5173 # Добавлено
    depends_on:
      - db
      - db_test
      - redis
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digital-queue-frontend
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_URL: http://localhost:8080 # Добавлено
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
  db_test_data:
  redis_data: